<div class="login-page">
  <div class="login-wrapper">
    <p-card styleClass="login-card">
      <ng-template pTemplate="header">
        <div class="login-header">
          <div class="brand-avatar">
            <i class="pi pi-prime"></i>
          </div>
          <h2>Sign In to Demo</h2>
          <p class="subtitle">Enter your credentials to access the application</p>
        </div>
      </ng-template>

      <!-- Success Alert Banner -->
      <div *ngIf="successNotice()" class="success-banner">
        <i class="pi pi-check-circle"></i>
        <span>{{ successNotice() }}</span>
      </div>

      <!-- Error Alert Banner -->
      <div *ngIf="errorMessage()" class="error-banner">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ errorMessage() }}</span>
      </div>

      <!-- Google OAuth2 Button -->
      <button type="button" class="btn-google" (click)="loginWithGoogle()">
        <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Sign in with Google</span>
      </button>

      <div class="or-divider">
        <span>OR SIGN IN WITH REGISTERED EMAIL</span>
      </div>

      <form (ngSubmit)="onSubmit()" class="login-form">
        <!-- Username -->
        <div class="field">
          <label for="username">Email / Username *</label>
          <div class="input-wrapper">
            <i class="pi pi-user field-icon"></i>
            <input
              id="username"
              type="text"
              pInputText
              [(ngModel)]="username"
              name="username"
              placeholder="user@example.com"
              required
              class="w-full pl-5"
              autocomplete="username" />
          </div>
        </div>

        <!-- Password -->
        <div class="field">
          <label for="password">Password *</label>
          <div class="input-wrapper">
            <i class="pi pi-lock field-icon"></i>
            <p-password
              id="password"
              [(ngModel)]="password"
              name="password"
              placeholder="password"
              [feedback]="false"
              [toggleMask]="true"
              styleClass="w-full"
              inputStyleClass="w-full pl-5"
              required
              autocomplete="current-password" />
          </div>
        </div>

        <!-- Submit Button -->
        <p-button
          type="submit"
          label="Sign In"
          icon="pi pi-sign-in"
          [loading]="loading()"
          styleClass="w-full mt-3 submit-btn" />
      </form>

      <!-- Sign Up Prompt -->
      <div class="signup-prompt">
        <span>Don't have an account?</span>
        <a routerLink="/register" class="signup-link">Sign Up</a>
      </div>

      <!-- Quick Credentials Box -->
      <div class="quick-credentials">
        <div class="credentials-top">
          <span class="label"><i class="pi pi-info-circle mr-1"></i> Registered Demo Account</span>
          <p-button
            label="Quick Fill"
            icon="pi pi-bolt"
            size="small"
            [outlined]="true"
            severity="info"
            (onClick)="quickFill()" />
        </div>
        <div class="credentials-details">
          <span>Email: <code>user&#64;example.com</code></span>
          <span>Password: <code>password</code></span>
        </div>
      </div>

      <ng-template pTemplate="footer">
        <div class="login-footer">
          <span>Java 21 REST API &bull; Angular 19 &bull; PrimeNG</span>
        </div>
      </ng-template>
    </p-card>
  </div>
</div>
